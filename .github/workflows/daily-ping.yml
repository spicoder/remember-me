name: Daily 4:55 PM Ping

on:
  schedule:
    - cron: "55 8 * * *" # 8:55 AM UTC = 4:55 PM Asia/Manila (UTC+8)

  workflow_dispatch:

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Hit Ping Endpoint
        run: |
          curl --fail --silent --show-error https://remember-me-vhba.onrender.com/ping
